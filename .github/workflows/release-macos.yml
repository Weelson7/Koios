name: macOS Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "Koios" --icon=Koïos_Logo.png --add-data "templates:templates" --add-data "core:core" --add-data "ui:ui" --add-data "utils:utils" --add-data "styles.css:." app.py
    
    - name: Create DMG
      run: |
        mkdir -p build/dmg
        cp -R dist/Koios.app build/dmg/
        hdiutil create -volname "Koios" -srcfolder build/dmg -ov -format UDZO Koios-macOS.dmg
    
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: Koios-macOS.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
