name: Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pillow
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name "Koios" --icon="Koïos_Logo.png" --add-data "templates;templates" --add-data "core;core" --add-data "ui;ui" --add-data "utils;utils" --add-data "styles.css;." --hidden-import=streamlit app.py
      
    - name: Create zip archive
      run: |
        powershell -Command "Compress-Archive -Path dist\Koios.exe -DestinationPath Koios-Windows-x64.zip"
    
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: Koios-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
