name: Linux Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pillow
    
    - name: Build executable
      run: |
        pyinstaller --onefile --name "Koios" --icon="Koïos_Logo.png" --add-data "templates:templates" --add-data "core:core" --add-data "ui:ui" --add-data "utils:utils" --add-data "styles.css:." --hidden-import=streamlit app.py
    
    - name: Create tar.gz archive
      run: |
        tar -czf Koios-Linux-x64.tar.gz -C dist Koios
    
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: Koios-Linux-x64.tar.gz
        token: ${{ secrets.GITHUB_TOKEN }}
      if: github.event_name == 'release'
